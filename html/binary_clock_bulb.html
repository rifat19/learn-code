<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Binary Bulb Clock</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding-top: 50px;
    }

    .clock {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .bulb {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #333;
      box-shadow: 0 0 5px #000;
      transition: background 0.3s;
    }

    .on {
      background: limegreen;
      box-shadow: 0 0 10px lime;
    }

    h2 {
      margin-top: 20px;
      font-size: 18px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>💡 Binary Bulb Clock</h1>
  <div class="clock" id="clock">
    <!-- Sections will be generated by JS -->
  </div>

  <script>
    const config = {
      hour: [2, 2],     // top: 2 bits, bottom: 2 bits → max 24
      minute: [3, 4],   // top: 3 bits, bottom: 4 bits → max 60
      second: [3, 4]
    };

    const clockContainer = document.getElementById('clock');

    function createSection(name, topCount, bottomCount) {
      const section = document.createElement('div');
      section.className = 'section';
      section.dataset.unit = name;

      const topRow = document.createElement('div');
      topRow.className = 'row top';
      for (let i = 0; i < topCount; i++) {
        const bulb = document.createElement('div');
        bulb.className = 'bulb';
        topRow.appendChild(bulb);
      }

      const bottomRow = document.createElement('div');
      bottomRow.className = 'row bottom';
      for (let i = 0; i < bottomCount; i++) {
        const bulb = document.createElement('div');
        bulb.className = 'bulb';
        bottomRow.appendChild(bulb);
      }

      section.appendChild(topRow);
      section.appendChild(bottomRow);
      clockContainer.appendChild(section);
    }

    // Create all sections
    for (let unit in config) {
      createSection(unit, config[unit][0], config[unit][1]);
    }

    function updateClock() {
      const now = new Date();
      const time = {
        hour: now.getHours(),
        minute: now.getMinutes(),
        second: now.getSeconds()
      };

      for (let unit in time) {
        const value = time[unit].toString().padStart(2, '0');
        const top = parseInt(value[0]);
        const bottom = parseInt(value[1]);

        const section = document.querySelector(`.section[data-unit="${unit}"]`);
        const topBulbs = section.querySelectorAll('.top .bulb');
        const bottomBulbs = section.querySelectorAll('.bottom .bulb');

        // Convert to binary and update bulbs
        const topBinary = top.toString(2).padStart(topBulbs.length, '0');
        const bottomBinary = bottom.toString(2).padStart(bottomBulbs.length, '0');

        topBinary.split('').forEach((bit, i) => {
		  if (topBulbs[i]) {
            topBulbs[i].classList.toggle('on', bit === '1');
		  }
        });

        bottomBinary.split('').forEach((bit, i) => {
		  if (bottomBulbs[i]) {
            bottomBulbs[i].classList.toggle('on', bit === '1');
		  }
        });
      }
    }

    setInterval(updateClock, 1000);
    updateClock(); // initial call
  </script>

</body>
</html>
