 <!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FullCalendar Demo</title>

	<!-- FullCalendar CSS -->
	<link href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.8/index.global.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.8/index.global.min.css" rel="stylesheet">
	
	<!-- Optional: Basic styling -->
	<style>
		
		body {
			font-family: Arial, sans-serif;
			background: #f4f4f4;
			padding: 40px;
		}

		#calendar {
			max-width: 900px;
			margin: 0 auto;
			background: #fff;
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}

	</style>
</head>
<body>

	<h2 style="text-align: center">📅 FullCalendar Demo</h2>
	<div id="calendar"></div>

	<!-- FullCalendar JS -->
	<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.8/index.global.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.8/index.global.min.js"></script>

	<script>

	 	document.addEventListener('DOMContentLoaded', function() {
			var calendarEl = document.getElementById('calendar');

			var calendar = new FullCalendar.Calendar(calendarEl, {
		  		initialView: 'dayGridMonth',
		  		headerToolbar: {
					left: 'prev,next today',
					center: 'title',
					right: 'dayGridMonth'
				},
				events: [
					{
						title: 'Sample Event',
						start: new Date().toISOString().split('T')[0]
					}
				]
			});

			calendar.render();
		});
		
	</script>

	
</body>
</html>
