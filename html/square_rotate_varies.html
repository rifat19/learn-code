<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Corner-Connected Square Mesh</title>
  <style>
    body {
      margin: 0;
      background: #111;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<canvas id="meshCanvas"></canvas>

<script>
const canvas = document.getElementById("meshCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const numSquares = 110;
const maxDistance = 180;
const squares = [];

for (let i = 0; i < numSquares; i++) {
  squares.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 1.2,
    vy: (Math.random() - 0.5) * 1.2,
    size: 40,
    angle: Math.random() * Math.PI * 2,
    connections: 0
  });
}

function getCorners(square) {
  const { x, y, size, angle } = square;
  const half = size / 2;
  const corners = [];

  for (let i = 0; i < 4; i++) {
    const theta = angle + (Math.PI / 2) * i;
    corners.push({
      x: x + Math.cos(theta) * half,
      y: y + Math.sin(theta) * half
    });
  }

  return corners;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  squares.forEach(s => s.connections = 0);

  // Connect corners
  for (let i = 0; i < numSquares; i++) {
    for (let j = i + 1; j < numSquares; j++) {
      const a = squares[i];
      const b = squares[j];
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < maxDistance) {
        const cornersA = getCorners(a);
        const cornersB = getCorners(b);

        ctx.strokeStyle = `rgba(0, 255, 255, ${1 - dist / maxDistance})`;
        ctx.lineWidth = 0.8;

        for (let ca of cornersA) {
          for (let cb of cornersB) {
            const cd = Math.hypot(ca.x - cb.x, ca.y - cb.y);
            if (cd < maxDistance / 2) {
              ctx.beginPath();
              ctx.moveTo(ca.x, ca.y);
              ctx.lineTo(cb.x, cb.y);
              ctx.stroke();
            }
          }
        }

        a.connections++;
        b.connections++;
      }
    }
  }

  // Draw squares
  for (let square of squares) {
    const speedFactor = Math.max(0.4, 2.5 - square.connections * 0.1);
    square.x += square.vx * speedFactor;
    square.y += square.vy * speedFactor;
    square.angle += 0.01;

    // Bounce
    if (square.x < 0 || square.x > canvas.width) square.vx *= -1;
    if (square.y < 0 || square.y > canvas.height) square.vy *= -1;

    // Depth effect: scale based on y-position
    const depthScale = 0.6 + (square.y / canvas.height) * 0.4;
    const size = square.size * depthScale;

    ctx.save();
    ctx.translate(square.x, square.y);
    ctx.rotate(square.angle);
    ctx.fillStyle = "#fff";
    ctx.fillRect(-size / 2, -size / 2, size, size);
    ctx.restore();
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
