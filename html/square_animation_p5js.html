<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Particle Mesh Animation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>
  <body>
    <script>
      let particles = [];
      const numParticles = 80;
      const maxDist = 150;

      function setup() {
        createCanvas(windowWidth, windowHeight, WEBGL);
        colorMode(HSB, 360, 100, 100); // Use HSB for vibrant variation
        for (let i = 0; i < numParticles; i++) {
          particles.push({
            pos: createVector(random(-400, 400), random(-300, 300), random(-300, 300)),
            vel: p5.Vector.random3D().mult(0.5),
            size: random(20, 40),
            rot: createVector(random(TWO_PI), random(TWO_PI), random(TWO_PI)),
            rotSpeed: createVector(random(0.01), random(0.01), random(0.01)),
            col: color(random(360), 80, 100) // Random hue, vibrant saturation/brightness
          });
        }
      }

      function draw() {
        background(20);
        rotateY(frameCount * 0.002); // slow global rotation for depth

        // Draw connections
        stroke(180, 100, 100, 50); // cyan-ish lines with transparency
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            let a = particles[i].pos;
            let b = particles[j].pos;
            let d = p5.Vector.dist(a, b);
            if (d < maxDist) {
              line(a.x, a.y, a.z, b.x, b.y, b.z);
            }
          }
        }

        // Draw particles
        noStroke();
        for (let p of particles) {
          push();
          translate(p.pos.x, p.pos.y, p.pos.z);
          rotateX(p.rot.x);
          rotateY(p.rot.y);
          rotateZ(p.rot.z);
          fill(p.col);
          box(p.size);
          pop();

          // Update rotation
          p.rot.add(p.rotSpeed);

          // Move particle
          p.pos.add(p.vel);

          // Bounce off bounds
          for (let axis of ['x', 'y', 'z']) {
            if (abs(p.pos[axis]) > 400) {
              p.vel[axis] *= -1;
            }
          }
        }
      }
    </script>
  </body>
</html>
