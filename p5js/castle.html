<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>p5.js Castle</title>
    <!-- <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script> -->
    <script src="p5/p5.js"></script>
  </head>
  <body>
    <script>
      function setup() {
        createCanvas(800, 600);
        noStroke();
      }

      function draw() {

        // Background
        noStroke();
        fill("#b4c7e7");
        rect(0, 0, 800, 187);
        fill("#548235");
        rect(0, 187, 800, 296);
        fill("#4472c4");
        rect(0, 483, 800, 117);

        // Castle walls
        stroke("black");
        strokeWeight(1);
        fill("#e254d4");
        rect(57, 284, 88, 233);
        rect(145, 371, 517, 146);
        rect(662, 284, 88, 233);
        fill("#934bc9");
        rect(310, 214, 182, 157);
        fill("#e254d4");
        rect(145, 328, 39, 43);
        rect(224, 328, 39, 43);
        rect(303, 328, 39, 43);
        rect(381, 328, 39, 43);
        rect(459, 328, 39, 43);
        rect(543, 328, 39, 43);
        rect(623, 328, 39, 43);
        
        // Windows
        fill("#8497b0");
        ellipse(101, 325, 32, 55);
        ellipse(709, 325, 32, 55);
        rect(335, 230, 22, 43);
        rect(386, 230, 22, 43);
        rect(440, 230, 22, 43);
        
        // Roof
        fill("#843c0c");
        triangle(25, 284, 101, 167, 179, 284);
        triangle(281, 215, 401, 81, 519, 215);
        triangle(630, 285, 706, 167, 783, 285);

        // Flags
        strokeWeight(4);
        stroke("#d44316");
        line(101, 119, 101, 167);
        line(401, 27, 401, 81);
        line(706, 115, 706, 167);
        noStroke();
        fill("#ffc000");
        triangle(107, 146, 107, 119, 130, 132);
        triangle(405, 56, 405, 27, 427, 43);
        triangle(711, 142, 711, 115, 743, 131);

        // Door
        fill("#203864");
        rect(362, 433, 78, 84);
        arc(401, 433, 78, 65, PI, 2*PI);

      }
    </script>
  </body>
</html>
